<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  .slot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
          opacity: 0; transition: opacity .8s ease; background: #000; }
  .slot.on { opacity: 1; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #888; font: 24px system-ui, sans-serif; text-align: center; padding: 20px; }
  #dot { position: absolute; right: 8px; bottom: 8px; width: 8px; height: 8px; border-radius: 50%; background: #c33; }
  #dot.ok { background: transparent; }
  #start { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
           background: #000c; color: #fff; font: 28px system-ui; cursor: pointer; }
</style>
</head>
<body>
<div id="msg">Conectando…</div>
<div id="stage"></div>
<div id="dot"></div>
<div id="start">Toca para iniciar la pantalla</div>

<script src="/socket.io/socket.io.js"></script>
<script>
// Nombre de la pantalla: player.html?pantalla=local1
const params = new URLSearchParams(location.search);
const SCREEN = (params.get('pantalla') || 'pantalla-1').toLowerCase();
const KEY = 'signage:' + SCREEN;
document.title = 'Pantalla ' + SCREEN;

const stage = document.getElementById('stage');
const msg = document.getElementById('msg');
const dot = document.getElementById('dot');

let data = null;          // { playlist, override }
let index = -1, timer = null, current = null;

// Si se va el internet, seguimos con la última playlist guardada
try { data = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

function makeEl(item) {
  let el;
  if (item.type === 'video') {
    el = document.createElement('video');
    el.muted = true; el.playsInline = true; el.autoplay = true; el.preload = 'auto';
  } else {
    el = document.createElement('img');
  }
  el.src = item.url;
  el.className = 'slot';
  return el;
}

function show(item, onEnd, loopForever) {
  clearTimeout(timer);
  const el = makeEl(item);
  stage.appendChild(el);
  const old = current; current = el;
  requestAnimationFrame(() => el.classList.add('on'));
  if (old) setTimeout(() => old.remove(), 900);

  if (item.type === 'video') {
    el.loop = !!loopForever;
    el.onended = onEnd;
    el.onerror = () => { timer = setTimeout(onEnd, 2000); };
    el.play().catch(() => { document.getElementById('start').style.display = 'flex'; });
    // Seguro: si el video se queda colgado, avanzar igual
    if (!loopForever) timer = setTimeout(onEnd, 30 * 60000);
  } else if (!loopForever) {
    el.onerror = () => { timer = setTimeout(onEnd, 2000); };
    timer = setTimeout(onEnd, (item.duration || 10) * 1000);
  }
}

function next() {
  if (!data) return;
  // 1) ¿Hay un "Mostrar YA" activo?
  if (data.override && data.override.until > Date.now()) {
    msg.style.display = 'none';
    show(data.override, null, true);
    timer = setTimeout(next, data.override.until - Date.now());
    return;
  }
  // 2) Playlist normal en bucle
  const list = data.playlist || [];
  if (!list.length) {
    if (current) { current.remove(); current = null; }
    msg.style.display = 'flex';
    msg.textContent = 'Pantalla "' + SCREEN + '" lista. Asígnale contenido desde el panel.';
    return;
  }
  msg.style.display = 'none';
  index = (index + 1) % list.length;
  show(list[index], next, list.length === 1 && list[0].type === 'video');
}

function apply(newData) {
  data = newData;
  localStorage.setItem(KEY, JSON.stringify(data));
  // Pre-carga para que no haya pantallazos negros
  (data.playlist || []).forEach((it) => { if (it.type === 'image') new Image().src = it.url; });
  index = -1;
  next();
}

const socket = io({ reconnectionDelayMax: 10000 });
socket.on('connect', () => { dot.className = 'ok'; socket.emit('register', SCREEN); });
socket.on('disconnect', () => { dot.className = ''; });
socket.on('update', apply);
socket.on('reload', () => location.reload());

document.getElementById('start').onclick = (e) => {
  e.currentTarget.style.display = 'none';
  document.documentElement.requestFullscreen?.().catch(() => {});
  if (current && current.play) current.play();
};

// Evita que la TV/tablet se apague
navigator.wakeLock?.request('screen').catch(() => {});
// Recarga diaria a las 4am para mantener todo fresco
setInterval(() => { const d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0) location.reload(); }, 60000);

if (data) next();
</script>
</body>
</html>
